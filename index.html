.search-status:empty{display:none}
.search-results{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.search-results:empty{display:none}
.res{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;font:inherit;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;cursor:pointer}
.res:hover,.res:focus-visible{border-color:var(--pounamu)}
.res-kind{grid-row:1/4;align-self:start;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pounamu);background:color-mix(in srgb,var(--pounamu) 10%,var(--surface));border-radius:6px;padding:3px 7px;margin-top:2px;white-space:nowrap}
.res-title{font-weight:600}
.res-detail{font-size:.875rem;color:var(--muted)}
.res-where{font-size:.78rem;color:var(--harbour)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--kowhai)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.8s ease-out}
@media (max-width:640px){.res{grid-template-columns:1fr}.res-kind{grid-row:auto;justify-self:start}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--kowhai)}}
/* topic links inside category dropdowns */
.topic-link{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.topic-link:last-child{border-bottom:0}
.topic-link .reo{font-family:var(--serif);font-style:italic;color:var(--pounamu);font-size:.95rem}
.topic-link .acc-title{font-weight:600;font-size:1.02rem}
.topic-link .arrow{color:var(--muted);font-size:1.1rem;transition:transform .15s}
.topic-link:hover .acc-title{color:var(--pounamu)}
.topic-link:hover .arrow{color:var(--pounamu);transform:translateX(3px)}
/* back links on topic pages */
.back-links{display:flex;flex-wrap:wrap;gap:8px}
.back-links.top{margin-top:26px}
.back-btn{display:inline-flex;align-items:center;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 14px}
.back-btn:hover{border-color:var(--pounamu);color:var(--pounamu)}
.page-foot-links{margin-top:44px;display:grid;gap:14px}
.page-foot-links .next-topic{margin-top:0}
.btn:disabled{opacity:.6;cursor:progress}
@media (prefers-reduced-motion:reduce){.topic-link .arrow{transition:none}}
/* latest numbers: three rows of two */
.ticker{grid-template-columns:repeat(2,minmax(0,1fr))}
.ticker li{border-right:0;border-bottom:1px solid var(--rule);padding-left:0}
.ticker li:nth-child(odd){border-right:1px solid var(--rule)}
.ticker li:nth-child(even){padding-left:0;border-left:0}
.ticker li a,.ticker li:first-child a{margin-left:0;padding:16px 16px 14px 0}
.ticker li:nth-child(even) a{padding-left:20px}
.ticker strong{font-size:1.5rem}
@media (max-width:640px){.ticker strong{font-size:1.25rem}.ticker li:nth-child(even) a{padding-left:14px}}
/* mobile hero: text and map side by side, no overlap */
@media (max-width:640px){
  .hero:has(.nz-art){display:flex;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:28px 18px 26px}
  .hero:has(.nz-art) .hero-copy{order:1;flex:1 1 auto;min-width:0}
  .nz-art{order:2;position:relative;right:auto;top:auto;transform:none;flex:0 0 auto;width:28%;max-width:120px;opacity:1}
  .hero h1{font-size:clamp(2rem,9.5vw,2.6rem)}
  .lede{font-size:1.02rem;margin-top:14px}
}

<script>
/* Aotearoa Unpacked: dependency-free SVG charts with time-range support */
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  let W = 640;
  const nf = new Intl.NumberFormat("en-NZ");
  const nf1 = new Intl.NumberFormat("en-NZ", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const FORMATS = {
    count: { full: (v) => nf.format(Math.round(v)), axis: (v) => (Math.abs(v) >= 1e6 ? nf.format(v / 1e6) + "m" : Math.abs(v) >= 1000 ? nf.format(v / 1000) + "k" : nf.format(v)) },
    percent: { full: (v) => nf1.format(v) + "%", axis: (v) => nf.format(v) + "%" },
    dollars: { full: (v) => "$" + nf.format(Math.round(v)), axis: (v) => (v >= 1e6 ? "$" + nf.format(v / 1e6) + "m" : "$" + nf.format(v / 1000) + "k") },
    years: { full: (v) => nf1.format(v) + " years", axis: (v) => nf.format(v) },
    mt: { full: (v) => nf1.format(v) + " Mt", axis: (v) => nf.format(v) },
    index: { full: (v) => nf1.format(v), axis: (v) => nf.format(v) },
    dollars2: { full: (v) => "$" + v.toFixed(2), axis: (v) => "$" + nf.format(v) },
    ratio: { full: (v) => v.toFixed(2), axis: (v) => v.toFixed(2) },
    pj: { full: (v) => nf1.format(v) + " PJ", axis: (v) => nf.format(v) },
    cents: { full: (v) => nf1.format(v) + "c", axis: (v) => nf.format(v) + "c" },
    billions: { full: (v) => "$" + nf1.format(v) + "b", axis: (v) => "$" + nf.format(v) + "b" }
  };
  const color = (n) => `var(--${n || "ink"})`;

  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function mtext(parent, x, y, str, attrs) {
    const t = el("text", Object.assign({ x, y }, attrs), parent);
    String(str).split("\n").forEach((line, i) => el("tspan", { x, dy: i ? "1.2em" : 0 }, t, line));
    return t;
  }
  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const raw = span / (count || 5);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
    return out;
  }
  function yearTicks(x0, x1, maxTicks) {
    const span = x1 - x0;
    const steps = [1, 2, 5, 10, 20, 25, 50];
    let step = steps.find((s) => span / s <= maxTicks) || 100;
    const out = [];
    for (let y = Math.ceil(x0 / step) * step; y <= x1 + 1e-9; y += step) out.push(y);
    return out;
  }

  /* ---------- tooltip ---------- */
  let tip = null;
  function ensureTip() {
    if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip); }
    return tip;
  }
  function moveTip(x, y) {
    const t = ensureTip(), pad = 14;
    let left = x + pad, top = y - t.offsetHeight - pad;
    if (left + t.offsetWidth > window.innerWidth - 8) left = x - t.offsetWidth - pad;
    if (left < 8) left = 8;
    if (top < 8) top = y + pad;
    t.style.left = left + "px"; t.style.top = top + "px";
  }
  function showTip(text, x, y) { const t = ensureTip(); t.textContent = text; t.hidden = false; moveTip(x, y); }
  function hideTip() { if (tip) tip.hidden = true; }
  function bindTip(node, text) {
    node.setAttribute("tabindex", "0");
    node.setAttribute("aria-label", text.replace(/\n/g, ", "));
    node.classList.add("mark");
    node.addEventListener("pointerenter", (e) => showTip(text, e.clientX, e.clientY));
    node.addEventListener("pointermove", (e) => moveTip(e.clientX, e.clientY));
    node.addEventListener("pointerleave", hideTip);
    node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip(text, r.left + r.width / 2, r.top); });
    node.addEventListener("blur", hideTip);
  }
  window.addEventListener("scroll", hideTip, { passive: true });

  function yGrid(g, ticks, Y, m, f) {
    const grid = el("g", { class: "grid" }, g);
    ticks.forEach((t) => {
      el("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: t === 0 ? "zero" : "" }, grid);
      el("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", class: "tick" }, grid, f(t));
    });
  }
  function drawBand(g, c, Y, m) {
    if (c.band) {
      const y1 = Y(c.band.to), y2 = Y(c.band.from);
      el("rect", { x: m.l, y: y1, width: W - m.l - m.r, height: y2 - y1, class: "band" }, g);
    }
    if (c.refLine) {
      const y = Y(c.refLine.value);
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, class: "ref" }, g);
    }
  }

  /* ---------- line ---------- */
  function line(svg, c, f, range) {
    const H = 340, narrow = W < 500;
    const m = { t: 18, r: 18, b: 38, l: narrow ? 50 : 62 };
    const inRange = (p) => !range || (p[0] >= range.from && p[0] <= range.to);
    const series = c.series.map((s) => Object.assign({}, s, { pts: s.points.filter(inRange) })).filter((s) => s.pts.length);
    const all = series.flatMap((s) => s.pts);
    if (!all.length) return;
    const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    let lo, hi;
    if (c.yDomain) [lo, hi] = c.yDomain;
    else { lo = Math.min(...ys); hi = Math.max(...ys); if (c.zero !== false) lo = Math.min(0, lo); else { const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad; } }
    const ticks = niceTicks(lo, hi, 5);
    const ylo = c.yDomain ? c.yDomain[0] : ticks[0], yhi = c.yDomain ? c.yDomain[1] : ticks[ticks.length - 1];
    const visTicks = ticks.filter((t) => t >= ylo - 1e-9 && t <= yhi + 1e-9);
    const X = (v) => m.l + ((v - x0) / (x1 - x0 || 1)) * (W - m.l - m.r);
    const Y = (v) => H - m.b - ((v - ylo) / (yhi - ylo || 1)) * (H - m.t - m.b);

    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const g = el("g", {}, svg);
    yGrid(g, visTicks, Y, m, f.axis);
    drawBand(g, c, Y, m);
    const xa = el("g", { class: "x-axis" }, g);
    yearTicks(x0, x1, narrow ? 4 : 7).forEach((t) => {
      el("line", { x1: X(t), x2: X(t), y1: H - m.b, y2: H - m.b + 5, class: "tickmark" }, xa);
      el("text", { x: X(t), y: H - m.b + 22, "text-anchor": "middle", class: "tick" }, xa, String(t));
    });

    series.forEach((s) => {
      const d = s.pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
      el("path", { d, class: "series-line" + (s.dashed ? " dashed" : ""), style: `stroke:${color(s.color)}` }, g);
      if (s.pts.length <= 40) s.pts.forEach((p) => el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3.5, class: "dot small", style: `fill:${color(s.color)}` }, g));
    });

    /* crosshair */
    const keys = Array.from(new Set(all.map((p) => p[0]))).sort((a, b) => a - b);
    const guide = el("line", { x1: 0, x2: 0, y1: m.t, y2: H - m.b, class: "guide", visibility: "hidden" }, g);
    const hl = series.map((s) => el("circle", { r: 5.5, class: "dot", style: `fill:${color(s.color)}`, visibility: "hidden" }, g));
    const overlay = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: "overlay", tabindex: 0, role: "button",
      "aria-label": "Chart values. Use left and right arrow keys to move between data points." }, g);
    let idx = keys.length - 1;
    function showAt(i, cx, cy) {
      idx = Math.max(0, Math.min(keys.length - 1, i));
      const k = keys[idx];
      guide.setAttribute("x1", X(k)); guide.setAttribute("x2", X(k)); guide.setAttribute("visibility", "visible");
      let label = null; const lines = [];

      presets.querySelectorAll("button").forEach((btn) => btn.setAttribute("aria-pressed", String(+btn.dataset.from === f && t === max)));
    }
    let raf = 0;
    const onInput = (e) => { sync(e.target); cancelAnimationFrame(raf); raf = requestAnimationFrame(redraw); };
    a.addEventListener("input", onInput); b.addEventListener("input", onInput);
    const presets = h("div", { class: "presets", role: "group", "aria-label": "Quick ranges" });
    [[10, "10 years"], [25, "25 years"], [50, "50 years"]].forEach(([n, txt]) => {
      if (max - min > n) presets.appendChild(h("button", { type: "button", class: "chip", "data-from": max - n, text: txt, on: { click: () => { a.value = max - n; b.value = max; sync(a); redraw(); } } }));
    });
    presets.appendChild(h("button", { type: "button", class: "chip", "data-from": min, text: `All (${min}–${max})`, on: { click: () => { a.value = min; b.value = max; sync(a); redraw(); } } }));
    wrap.append(h("div", { class: "range-head" }, [label, presets]), track, h("div", { class: "range-ends", "aria-hidden": "true" }, [h("span", { text: String(min) }), h("span", { text: String(max) })]));
    sync(a);
    return wrap;
  }


  /* ---------- PNG export ---------- */
  const STYLE_PROPS = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "visibility", "font-family", "font-size", "font-weight", "text-anchor", "dominant-baseline", "paint-order"];
  function wrapText(ctx, text, maxW) {
    const words = String(text).split(" "), lines = []; let line = "";
    words.forEach((w) => { const tryL = line ? line + " " + w : w; if (ctx.measureText(tryL).width > maxW && line) { lines.push(line); line = w; } else line = tryL; });
    if (line) lines.push(line); return lines;
  }
  function exportPNG(fig, c, btn) {
    const svg = fig.querySelector(".chart-frame svg"); if (!svg) return;
    const label = btn ? btn.textContent : ""; if (btn) { btn.textContent = "Preparing…"; btn.disabled = true; }
    const done = () => { if (btn) { btn.textContent = label; btn.disabled = false; } };
    try {
      const root = getComputedStyle(document.documentElement);
      const v = (n) => root.getPropertyValue("--" + n).trim();
      const clone = svg.cloneNode(true);
      const src = [svg, ...svg.querySelectorAll("*")], dst = [clone, ...clone.querySelectorAll("*")];
      src.forEach((el, i) => {
        const cs = getComputedStyle(el);
        dst[i].setAttribute("style", STYLE_PROPS.map((p) => `${p}:${cs.getPropertyValue(p)}`).join(";"));
        dst[i].removeAttribute("class"); dst[i].removeAttribute("tabindex");
      });
      clone.querySelectorAll("[visibility='hidden']").forEach((el) => el.remove());
      const vb = svg.viewBox.baseVal;
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", vb.width); clone.setAttribute("height", vb.height);
      const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml;charset=utf-8" }));
      const img = new Image();
      img.onload = () => {
        const S = 2, pad = 32, W = vb.width + pad * 2;
        const ctx0 = document.createElement("canvas").getContext("2d");
        const sans = getComputedStyle(document.body).fontFamily;
        ctx0.font = `700 22px ${sans}`; const tLines = wrapText(ctx0, c.title, W - pad * 2);
        ctx0.font = `400 14px ${sans}`; const sLines = wrapText(ctx0, c.subtitle, W - pad * 2);
        const items = C.legendItems(c);
        const srcText = (c.sources.length > 1 ? "Sources: " : "Source: ") + c.sources.map((s) => s[0]).join("; ");
        ctx0.font = `400 12px ${sans}`; const fLines = wrapText(ctx0, srcText, W - pad * 2);
        const legendH = items.length ? 26 : 0;
        const H = pad + tLines.length * 28 + sLines.length * 20 + 8 + legendH + vb.height + 18 + fLines.length * 17 + 24 + pad - 12;
        const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
        const ctx = cv.getContext("2d"); ctx.scale(S, S);
        ctx.fillStyle = v("surface") || "#fff"; ctx.fillRect(0, 0, W, H);
        let y = pad;
        ctx.fillStyle = v("ink"); ctx.font = `700 22px ${sans}`; ctx.textBaseline = "top";
        tLines.forEach((l) => { ctx.fillText(l, pad, y); y += 28; });
        ctx.fillStyle = v("muted"); ctx.font = `400 14px ${sans}`;
        sLines.forEach((l) => { ctx.fillText(l, pad, y); y += 20; });
        y += 8;
        if (items.length) {
          let x = pad; ctx.font = `400 13px ${sans}`;
          items.forEach((it) => {
            const col = v(it.color) || v("ink");
            if (it.kind === "dashed" || it.kind === "ref") { ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x + 18, y + 8); ctx.stroke(); ctx.setLineDash([]); }
            else if (it.kind === "marker") { ctx.fillStyle = col; ctx.fillRect(x, y + 6, 18, 3); }
            else if (it.kind === "band") { ctx.fillStyle = v("band"); ctx.fillRect(x, y + 2, 18, 12); }
            else { ctx.fillStyle = col; ctx.fillRect(x, y + 1, 14, 14); }
            ctx.fillStyle = v("ink"); ctx.fillText(it.name, x + 22, y + 2);
            x += 22 + ctx.measureText(it.name).width + 18;
          });
          y += legendH;
        }
        ctx.drawImage(img, pad, y, vb.width, vb.height); y += vb.height + 18;
        ctx.fillStyle = v("muted"); ctx.font = `400 12px ${sans}`;
        fLines.forEach((l) => { ctx.fillText(l, pad, y); y += 17; });
        ctx.fillStyle = v("pounamu"); ctx.font = `700 12px ${sans}`; ctx.fillText("Aotearoa Unpacked", pad, y + 6);
        URL.revokeObjectURL(url);
        cv.toBlob((blob) => {
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `aotearoa-unpacked-${c.id}.png`;
          document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0); done();
        }, "image/png");
      };
      img.onerror = () => { URL.revokeObjectURL(url); done(); };
      img.src = url;
    } catch (e) { done(); }
  }

  /* ---------- chart figure ---------- */
  const live = [];
  function figure(c) {
    const fig = h("figure", { class: "chart", id: c.id });
    fig.append(h("h3", { id: c.id + "-title", text: c.title }), h("p", { class: "chart-sub", id: c.id + "-sub", text: c.subtitle }));
    const items = C.legendItems(c);
    if (items.length) fig.appendChild(h("ul", { class: "legend", "aria-label": "Key" }, items.map((it) => h("li", {}, [h("span", { class: "swatch " + it.kind, style: `--sw: var(--${it.color})`, "aria-hidden": "true" }), it.name]))));
    const frame = h("div", { class: "chart-frame" });
    let state = null;
    if (c.range) {
      const [min, max] = C.extent(c);
      state = { from: Math.max(min, c.defaultFrom || min), to: max };
    }
    const draw = () => C.render(frame, c, state ? { from: state.from, to: state.to + 0.99 } : null);
    fig.appendChild(frame);
    if (state) fig.appendChild(rangeControl(c, state, draw));
    live.push(draw);

    const t = C.toTable(c);
    const table = h("table", {}, [
      h("thead", {}, [h("tr", {}, t.head.map((x) => h("th", { scope: "col", text: x })))]),
      h("tbody", {}, t.rows.map((r) => h("tr", {}, r.map((v, i) => i === 0 ? h("th", { scope: "row", text: v }) : h("td", { text: typeof v === "number" ? (Number.isInteger(v) ? nf.format(v) : String(v)) : v })))))
    ]);
    fig.appendChild(h("figcaption", {}, [
      h("p", { class: "note", text: c.notes }),
      h("div", { class: "source-block" }, [h("p", { class: "source-label", text: c.sources.length > 1 ? "Sources" : "Source" }),
        h("ul", { class: "sources" }, c.sources.map(([label, url]) => h("li", {}, [h("a", { href: url, rel: "noopener", target: "_blank", text: label })])))]),
      h("div", { class: "chart-actions" }, [
        h("details", { class: "data-table" }, [h("summary", { text: "Show the numbers" }), h("div", { class: "table-wrap" }, [table])]),
        h("div", { class: "btn-row" }, [h("button", { type: "button", class: "btn", text: "Download PNG", on: { click: (ev) => exportPNG(fig, c, ev.currentTarget) } }), h("button", { type: "button", class: "btn", text: "Download CSV", on: { click: () => download(`aotearoa-unpacked-${c.id}.csv`, toCSV(t)) } })])
      ])
    ]));
    return fig;
  }


  /* ---------- search ---------- */
  const fold = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const INDEX = [];
  D.topics.forEach((t) => {
    const g = GROUPS.find((x) => x.name === t.group);
    INDEX.push({ kind: "Topic", title: t.title, detail: t.blurb, t, g, hay: fold([t.title, t.reo, t.blurb, t.keywords || "", t.group].join(" ")) });
    t.stats.forEach(([v, l]) => INDEX.push({ kind: "Key figure", title: v, detail: l, t, g, hay: fold([v, l, t.title, t.keywords || ""].join(" ")) }));
    t.charts.forEach((c) => INDEX.push({ kind: "Chart", title: c.title, detail: c.subtitle, t, g, c,
      hay: fold([c.title, c.subtitle, t.title, t.keywords || "", (c.series || []).map((s) => s.name).join(" "), (c.categories || []).join(" ")].join(" ")) }));
  });
  const KIND_ORDER = { "Chart": 0, "Key figure": 1, "Topic": 2 };
  function runSearch(q) {
    const words = fold(q).split(/\s+/).filter((w) => w.length > 1 || /\d/.test(w));
    if (!words.length) return [];
    return INDEX.filter((e) => words.every((w) => e.hay.includes(w)))
      .map((e) => ({ e, score: words.filter((w) => fold(e.title).includes(w)).length * 2 + (fold(e.t.title).includes(words[0]) ? 1 : 0) - KIND_ORDER[e.kind] * 0.1 }))
      .sort((a, b) => b.score - a.score).slice(0, 12).map((x) => x.e);
  }
  let pendingChart = null;
  function openChart(e) {
    pendingChart = e.c ? e.c.id : null;
    if (location.hash.slice(1) === e.t.id) route(); else location.hash = e.t.id;
  }
  function searchBox(groupEls) {
    const input = h("input", { type: "search", id: "chart-search", class: "search-input", placeholder: "Search charts and figures, e.g. house prices, unemployment, smoking", autocomplete: "off", "aria-controls": "search-results", "aria-describedby": "search-status" });
    const status = h("p", { id: "search-status", class: "search-status", "aria-live": "polite" });
    const list = h("ul", { id: "search-results", class: "search-results" });
    let tmr;
    const show = () => {
      const q = input.value.trim();
      list.innerHTML = "";
      if (!q) { status.textContent = ""; return; }
      const res = runSearch(q);
      status.textContent = res.length ? `${res.length === 12 ? "Top 12" : res.length} result${res.length > 1 ? "s" : ""} for “${q}”` : `No results for “${q}”. Try a broader word such as “prices”, “jobs” or “emissions”.`;
      res.forEach((e) => {
        const body = [h("span", { class: "res-kind", text: e.kind }), h("span", { class: "res-title", text: e.title }), h("span", { class: "res-detail", text: e.detail }), h("span", { class: "res-where", text: `${e.g.name} › ${e.t.title}` })];
        const el = e.kind === "Chart"
          ? h("button", { type: "button", class: "res", on: { click: () => openChart(e) } }, body)
          : h("a", { class: "res", href: "#" + e.t.id }, body);
        list.appendChild(h("li", {}, [el]));
      });
    };
    input.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(show, 120); });
    input.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { input.value = ""; show(); } });
    return h("div", { class: "search", role: "search" }, [h("label", { for: "chart-search", class: "search-label", text: "Search for a chart or statistic" }), input, status, list]);
  }

  /* ---------- pages ---------- */
  const app = $("#app");
  function homePage(openSlug) {
    const art = document.createElement("div");
    art.className = "nz-art"; art.setAttribute("aria-hidden", "true");
    art.innerHTML = '<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">' + NZ_OUTLINE + '</svg>';
    const svg = art;
    const hero = h("section", { class: "hero", "aria-labelledby": "page-title" }, [svg, h("div", { class: "hero-copy" }, [
      h("h1", { id: "page-title", tabindex: "-1", text: "Aotearoa Unpacked" }),
      h("p", { class: "lede", text: "Understanding NZ’s key metrics with clear, reliable data" })
    ])]);
    const ticker = h("section", { class: "snapshot", "aria-labelledby": "snap-h" }, [h("h2", { id: "snap-h", class: "snapshot-title", text: "The latest numbers" }),
      h("ul", { class: "ticker" }, D.ticker.map(([v, l, t]) => h("li", {}, [h("a", { href: "#" + t }, [h("strong", { text: v }), h("span", { text: l })])])))]);
    const chev = () => h("span", { class: "chev", "aria-hidden": "true" });
    const topicAcc = (t) => h("a", { class: "topic-link", href: "#" + t.id }, [
      h("span", { class: "acc-text" }, [h("span", { class: "reo", lang: "mi", text: t.reo }), h("span", { class: "acc-title", text: t.title }), h("span", { class: "acc-blurb", text: t.blurb })]),
      h("span", { class: "arrow", "aria-hidden": "true", text: "→" })]);
    const groupAcc = (g) => {
      const n = g.items.reduce((s, t) => s + t.charts.length, 0);
      const d = h("details", { class: "group-acc", id: g.slug }, [
        h("summary", {}, [h("span", { class: "acc-text" }, [h("span", { class: "reo", lang: "mi", text: g.reo }), h("span", { class: "acc-title", text: g.name })]), chev()]),
        h("div", { class: "group-body" }, g.items.map(topicAcc))]);
      if (g.slug === openSlug) d.open = true;
      return d;
    };
    const groupEls = GROUPS.map(groupAcc);
    const search = searchBox(groupEls);
    const grid = h("section", { class: "explore", "aria-labelledby": "explore-h" }, [
      h("h2", { id: "explore-h", class: "snapshot-title", text: "Explore the charts" }),
      search,
      h("p", { class: "explore-hint", text: "Or open a category and choose a topic to see its charts." })
    ].concat(groupEls));
    const about = h("section", { class: "about", "aria-labelledby": "about-h" }, [h("h2", { id: "about-h", text: "About this site" }),
      h("p", { text: "Aotearoa Unpacked presents official statistics from Stats NZ, government ministries and other established sources as simple charts with short, neutral explanations. It is an independent, non-partisan project and is not affiliated with any of the agencies whose data it uses." }),
      h("p", { text: "Every chart names its sources and links to them. Some figures are provisional and are revised later, and a few series are calculated from official data; each chart’s notes say so. Check the source before relying on a number for anything important." }),
      h("p", { text: `Data last checked ${D.updated}. Chart graphics and text may be reused under CC BY 4.0 with credit to Aotearoa Unpacked and the original data source.` })]);
    app.append(hero, ticker, grid, about);
    document.title = "Aotearoa Unpacked: New Zealand’s statistics, charted and explained";
  }
  function topicPage(t) {
    const i = D.topics.indexOf(t), next = D.topics[(i + 1) % D.topics.length];
    const gslug = slugOf(t.group);
    const backLinks = (cls) => h("nav", { class: "back-links " + cls, "aria-label": cls === "top" ? "Breadcrumb" : "Back" }, [
      h("a", { class: "back-btn", href: "#top" }, [h("span", { "aria-hidden": "true", text: "← " }), "Home"]),
      h("a", { class: "back-btn", href: "#" + gslug }, [h("span", { "aria-hidden": "true", text: "← " }), t.group])]);
    app.append(
      backLinks("top"),
      h("header", { class: "topic-head" }, [h("p", { class: "reo-name", lang: "mi", text: t.reo }), h("h1", { id: "page-title", tabindex: "-1", text: t.title }), h("p", { class: "intro", text: t.intro })]),
      h("dl", { class: "facts" }, t.stats.map(([v, l]) => h("div", { class: "fact" }, [h("dt", { text: l }), h("dd", { text: v })])))
    );
    t.charts.forEach((c) => app.appendChild(figure(c)));
    app.appendChild(h("div", { class: "page-foot-links" }, [
      backLinks("bottom"),
      h("a", { class: "next-topic", href: "#" + next.id }, [h("span", { class: "next-label", text: "Next topic" }), h("span", { class: "next-title", text: `${next.reo}: ${next.title}` })])]));
    document.title = `${t.title} | Aotearoa Unpacked`;
  }
  function route() {
    const id = location.hash.slice(1);
    const t = D.topics.find((x) => x.id === id);
    const g = GROUPS.find((x) => x.slug === id);
    app.innerHTML = ""; live.length = 0;
    if (t) topicPage(t); else homePage(g && g.slug);
    live.forEach((d) => d());
    const activeSlug = t ? slugOf(t.group) : g ? g.slug : null;
    nav.querySelectorAll("li").forEach((li) => {
      const on = li.dataset.group === activeSlug;
      li.classList.toggle("active", on);
      const a = li.querySelector("a"); if (on) a.setAttribute("aria-current", t ? "true" : "location"); else a.removeAttribute("aria-current");
    });
    if (activeSlug) { const li = nav.querySelector(`[data-group="${activeSlug}"]`); if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest", inline: "center", behavior: reduceMotion ? "auto" : "smooth" }); }
    if (g) {
      const target = document.getElementById(g.slug);
      requestAnimationFrame(() => { target.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }); const s = target.querySelector("summary"); if (s) s.focus({ preventScroll: true }); });
    } else if (t && pendingChart && document.getElementById(pendingChart)) {
      const target = document.getElementById(pendingChart); pendingChart = null;
      window.scrollTo(0, 0);
      requestAnimationFrame(() => {
        target.scrollIntoView({ block: "start", behavior: "auto" });
        target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
        const f = target.querySelector("h3"); if (f) { f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }); }
      });
    } else {
      pendingChart = null;
      window.scrollTo(0, 0);
      const title = $("#page-title"); if (title && routed) title.focus({ preventScroll: true });
    }
    routed = true;
  }
  let routed = false;
  window.addEventListener("hashchange", route);
  route();

  let narrow = window.innerWidth < 560, rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const n = window.innerWidth < 560; if (n !== narrow) { narrow = n; live.forEach((d) => d()); } }, 150); });
})();

</script>
